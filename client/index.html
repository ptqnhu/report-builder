<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <title>LoanMart Insights</title>
    <!-- Loading screen: shown from the first paint, before the app's scripts and styles load (colours from .rb in styles.css). -->
    <style>
      #boot {
        position: fixed; inset: 0; z-index: 9999; display: flex; flex-direction: column; align-items: center; justify-content: center;
        gap: 22px; background: #F4F5F2; color: #5C6B65; font: 400 13px 'Inter Tight', system-ui, sans-serif;
      }
      #boot.open { background: transparent; pointer-events: none }
      /* The logo, bar and percentage go as soon as the ink green panel starts to rise */
      #boot.full .boot-in { visibility: hidden }
      #boot-brand { display: flex; align-items: center; gap: 10px; color: #0A2A1C; font: 600 19px 'Inter Tight', system-ui, sans-serif; letter-spacing: -.02em }
      #boot-load { display: flex; flex-direction: column; align-items: center; gap: 12px }
      #boot-track { width: min(320px, 70vw); height: 2px; border-radius: 2px; background: #E6EAE6; overflow: hidden }
      #boot-bar { height: 100%; width: 0; background: #0F5131 }
      #boot-pct { font-variant-numeric: tabular-nums; color: #66746E; font-size: 12px }
      /* At 100% an ink green panel rises from the bottom to cover the page, then carries on up and off the top,
         showing the page under it. */
      #boot-wipe {
        position: fixed; inset: 0; transform: translateY(100%);
        background: #0A2A1C;
      }
      body { margin: 0; background: #F4F5F2 }
    </style>
  </head>
  <body>
    <div id="boot" role="progressbar" aria-label="Loading LoanMart Insights" aria-valuemin="0" aria-valuemax="100" aria-valuenow="0">
      <p id="boot-brand" class="boot-in" style="margin: 0">
        <svg width="26" height="26" viewBox="0 0 32 32" aria-hidden="true">
          <defs><linearGradient id="boot-g" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#3F8564" /><stop offset="1" stop-color="#0F5131" /></linearGradient></defs>
          <circle cx="9" cy="10" r="5" fill="url(#boot-g)" />
          <circle cx="9" cy="22" r="5" fill="url(#boot-g)" opacity=".7" />
          <rect x="16" y="7" width="13" height="6" rx="3" fill="#0A2A1C" />
          <rect x="16" y="19" width="9" height="6" rx="3" fill="#0F5131" />
        </svg>
        LoanMart Insights
      </p>
      <div id="boot-load" class="boot-in">
        <div id="boot-track"><div id="boot-bar"></div></div>
        <span id="boot-pct">0%</span>
      </div>
      <div id="boot-wipe"></div>
    </div>
    <script>
      // The percentage counts up towards 90% while the page loads, then runs to 100% once it has. Then a green panel rises from the bottom to cover the page, and carries on up off the
      // top, showing the page under it.
      (function () {
        var boot = document.getElementById("boot"), bar = document.getElementById("boot-bar"), pct = document.getElementById("boot-pct");
        var shown = 0, target = 0, loaded = false, start = performance.now();
        var still = matchMedia("(prefers-reduced-motion: reduce)").matches;
        function frame(now) {
          target = loaded ? 100 : 90 * (1 - Math.exp(-(now - start) / 900));
          shown += Math.max((target - shown) * 0.1, loaded ? 0.8 : 0);
          if (shown > target) shown = target;
          var n = Math.floor(shown);
          bar.style.width = shown + "%";
          pct.textContent = n + "%";
          boot.setAttribute("aria-valuenow", n);
          if (n < 100) return requestAnimationFrame(frame);
          setTimeout(wipe, 220);
        }
        function wipe() {
          var w = document.getElementById("boot-wipe");
          if (still || !w.animate) return boot.remove();
          boot.classList.add("full");
          // Up from the bottom until it covers the page
          var rise = w.animate([{ transform: "translateY(100%)" }, { transform: "translateY(0)" }],
            { duration: 650, easing: "cubic-bezier(.7, 0, .3, 1)", fill: "forwards" });
          rise.onfinish = function () {
            // The panel covers everything: drop the light screen behind it, and carry on up to show the page
            boot.classList.add("open");
            var lift = w.animate([{ transform: "translateY(0)" }, { transform: "translateY(-100%)" }],
              { duration: 750, delay: 80, easing: "cubic-bezier(.7, 0, .3, 1)", fill: "forwards" });
            lift.onfinish = function () { boot.remove(); };
          };
        }
        requestAnimationFrame(frame);
        window.addEventListener("load", function () { loaded = true; });
      })();
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.jsx"></script>
  </body>
</html>
